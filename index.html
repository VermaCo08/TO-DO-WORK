<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Darvik's To-Do Work</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #EDEAE1;
    --paper-line: #D9D4C6;
    --ink: #23283A;
    --ink-soft: #565C72;
    --stamp-red: #A63A3A;
    --stamp-sage: #5C7A5E;
    --margin-red: #C87A6B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px
    );
    font-family: 'Space Mono', monospace;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .page {
    width: 100%;
    max-width: 620px;
    position: relative;
    padding-left: 34px;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 14px;
    width: 2px;
    background: var(--margin-red);
    opacity: 0.55;
  }

  header { margin-bottom: 28px; }

  .kicker {
    font-size: 15px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 40px;
    margin: 4px 0 2px;
  }

  .subhead { font-size: 13px; color: var(--ink-soft); font-weight: bold; }

  .entry-row { display: flex; gap: 10px; margin-bottom: 30px; }

  .entry-row input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 18px;
    padding: 8px 2px;
    color: var(--ink);
    outline: none;
  }

  .entry-row input[type="text"]::placeholder {
    color: var(--ink-soft);
    font-style: italic;
  }

  .entry-row button {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0 18px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }

  .entry-row button:hover { background: var(--stamp-red); }
  .entry-row button:active { transform: scale(0.96); }

  ul.list { list-style: none; margin: 0; padding: 0; }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 9px 0 9px 2px;
    border-bottom: 1px dashed var(--paper-line);
  }

  .check {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 2px;
    border: 2px solid var(--ink);
    cursor: pointer;
    position: relative;
    background: transparent;
  }

  .check.done { border-color: var(--stamp-sage); }

  .check.done::after {
    content: "✓";
    position: absolute;
    top: -5px;
    left: 2px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--stamp-sage);
  }

  .item-text {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    line-height: 1.35;
    padding-top: 1px;
    word-break: break-word;
  }

  li.item.done .item-text {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--stamp-sage);
    text-decoration-thickness: 1.5px;
  }

  .stamp {
    flex: none;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stamp-red);
    border: 1px solid var(--stamp-red);
    padding: 2px 6px;
    transform: rotate(-4deg);
    opacity: 0;
    transition: opacity 0.15s ease;
    align-self: center;
  }

  li.item.done .stamp { opacity: 0.8; }

  .remove {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    padding: 0 2px;
    align-self: center;
    line-height: 1;
  }
  .remove:hover { color: var(--stamp-red); }

  .empty {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    padding: 20px 0;
  }

  footer {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  .priority {
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 3px 6px;
  border: 1px solid currentColor;
  }

.priority.high {
  color: #A63A3A;
}

.priority.medium {
  color: #9A741C;
}

.priority.low {
  color: #5C7A5E;
}
.creator-credit {
  margin-top: 35px;
  text-align: center;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}

  footer button {
    background: none;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  footer button:hover { color: var(--stamp-red); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="margin-rule"></div>
    <header>
      <div class="kicker" id="dateLine">—</div>
      <h1>Darvik's To-Do Work</h1>
      <div class="subhead">Plan it. Do it. Finish it.
      <br> ======YOU CAN DO IT======
      </div>
    </header>
    

    <div class="entry-row">
      <input type="text" id="taskInput" placeholder="What needs doing…" maxlength="140">
      <select id = priorityinput>
        <option value="low">LOW</option>
        <option value="medium">MEDIUM</option>
        <option value="high">HIGH</option>
      </select>
      <button id="addBtn">Log it</button>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="emptyMsg">Nothing logged yet. The page is waiting.</div>

    <footer>
      <span id="countLine">0 open · 0 cleared . progress: 0%</span>
      <button id="clearDone">Clear stamped</button>
    </footer>
  </div>
  <div>
 <footer> 
    <div class="creator-credit">
         Published by Harsh Verma <br>
        Instagram: <a href="https://www.instagram.com/harshverma3618/" target="_blank">
            @harshverma3618
        </a>
    </div>
 </footer>
</div>

<script>
  const list = document.getElementById('list');
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const priorityinput = document.getElementById('priorityinput');
  const emptyMsg = document.getElementById('emptyMsg');
  const countLine = document.getElementById('countLine');
  const clearDoneBtn = document.getElementById('clearDone');
  const dateLine = document.getElementById('dateLine');

  let tasks = JSON.parse(localStorage.getItem("tasks")) ||[];
  let idCounter = 0;

  dateLine.textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const priority = document.getElementById('priorityinput').value;
    tasks.push({ id: idCounter++, text: trimmed, done: false, priority: priorityinput.value });
    localStorage.setItem('tasks', JSON.stringify(tasks));
    input.value = '';
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
     localStorage.setItem('tasks', JSON.stringify(tasks));
    render();
  }

  function removeTask(id) {
    tasks = tasks.filter(t => t.id !== id);
     localStorage.setItem('tasks', JSON.stringify(tasks));
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
     localStorage.setItem('tasks', JSON.stringify(tasks));
    render();
  }

  function render() {
    list.innerHTML = '';
    if (tasks.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = 'item' + (t.done ? ' done' : '');

        const check = document.createElement('button');
        check.className = 'check' + (t.done ? ' done' : '');
        check.setAttribute('aria-label', t.done ? 'Mark as open' : 'Mark as done');
        check.onclick = () => toggleTask(t.id);

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = t.text;
        const priority = document.createElement('span');
        priority.className = `priority ${t.priority}`;
        priority.textContent = t.priority;

        const stamp = document.createElement('span');
        stamp.className = 'stamp';
        stamp.textContent = 'cleared';

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.setAttribute('aria-label', 'Delete task');
        remove.textContent = '✕';
        remove.onclick = () => removeTask(t.id);

        li.appendChild(check);
        li.appendChild(span);
        li.appendChild(priority);
        li.appendChild(stamp);
        li.appendChild(remove);
        list.appendChild(li);
      });
    }

    const openCount = tasks.filter(t => !t.done).length;
    const doneCount = tasks.length - openCount;
    const progress = tasks.length === 0
    ? 0
    : Math.round((doneCount / tasks.length) * 100);
    countLine.textContent = `${openCount} open · ${doneCount} cleared · progress: ${progress}%`;
  }

  addBtn.addEventListener('click', () => addTask(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask(input.value);
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();
</script>
</body>
</html>
