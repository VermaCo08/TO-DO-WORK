<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Darvik's To-Do Work</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #EDEAE1;
    --paper-line: #D9D4C6;
    --ink: #23283A;
    --ink-soft: #565C72;
    --stamp-red: #A63A3A;
    --stamp-sage: #5C7A5E;
    --margin-red: #C87A6B;
    --today-ring: #6B7FB8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px
    );
    font-family: 'Space Mono', monospace;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .page {
    width: 100%;
    max-width: 620px;
    position: relative;
    padding-left: 34px;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 14px;
    width: 2px;
    background: var(--margin-red);
    opacity: 0.55;
  }

  header { margin-bottom: 28px; }

  .kicker {
    font-size: 15px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 40px;
    margin: 4px 0 2px;
  }

  .subhead { font-size: 13px; color: var(--ink-soft); font-weight: bold; }

  .entry-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 118px 90px;
  gap: 10px;
  margin-bottom: 30px;
}

  .entry-row input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 18px;
    padding: 8px 2px;
    color: var(--ink);
    outline: none;
  }

  .entry-row input[type="text"]::placeholder {
    color: var(--ink-soft);
    font-style: italic;
  }

  .entry-row button {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0 18px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }

  .entry-row button:hover { background: var(--stamp-red); }
  .entry-row button:active { transform: scale(0.96); }

  ul.list { list-style: none; margin: 0; padding: 0; }

li.item {
  display: grid;
  grid-template-columns: 35px minmax(0, 1fr) 75px 40px;
  align-items: center;
  gap: 6px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--paper-line);
}

  .check {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 2px;
    border: 2px solid var(--ink);
    cursor: pointer;
    position: relative;
    background: transparent;
  }

  .check.done { border-color: var(--stamp-sage); }

  .check.done::after {
    content: "✓";
    position: absolute;
    top: -5px;
    left: 2px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--stamp-sage);
  }

 .item-text {
  min-width: 0;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  line-height: 1.35;
  padding-top: 1px;
  word-break: normal;
  overflow-wrap: break-word;
}

  li.item.done .item-text {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--stamp-sage);
    text-decoration-thickness: 1.5px;
  }



  li.item.done .stamp { opacity: 0.8; }

.remove {
  justify-self: center;
  align-self: center;
  margin: 0;
  padding: 0;
}
  .remove:hover { color: var(--stamp-red); }

  .empty {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    padding: 20px 0;
  }

  footer {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
.priority {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 3px 6px;
  border: 1px solid currentColor;
  justify-self: center;
  margin-left: 0;
}

.priority.high {
  color: #A63A3A;
}

.priority.medium {
  color: #9A741C;
}

.priority.low {
  color: #5C7A5E;
}
.creator-credit {
  margin-top: 35px;
  text-align: center;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px 0;
  
}
.calendar-toggle {
  width: 150px;
  padding: 10px;
  margin-bottom: 12px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

.calendar-toggle:hover {
  background: var(--stamp-red);
}
.calendar {
  display: none;
  background: #fff;
  border: 1px solid var(--paper-line);
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 20px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.calendar-header h2 {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  margin: 0;
}

.calendar-header button {
  background: none;
  border: 1px solid var(--ink);
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.weekdays,
.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}

.weekdays {
  font-size: 10px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.calendar-days {
  gap: 4px;
}

.calendar-day {
  padding: 8px 0;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
}
.calendar-day.selected {
  background: var(--ink);
  color: var(--paper);
}


.calendar-day:hover {
  background: var(--paper);
}
.selected-date {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 14px;
}
.calendar-day.has-task .task-dot {
  display: block;
  width: 5px;
  height: 5px;
  background: var(--stamp-red);
  border-radius: 50%;
  margin: 4px auto 0;
}
.calendar-day {
  padding: 8px 0;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
}

.calendar-day.today .day-number::before {
  content: "(";
  color: black;
  font-weight: 700;
  margin-right: 2px;
}

.calendar-day.today .day-number::after {
  content: ")";
  color: black;
  font-weight: 700;
  margin-left: 2px;
}

.calendar-day.has-task .task-dot {
  display: block;
  width: 5px;
  height: 5px;
  background: var(--stamp-red);
  border-radius: 50%;
  margin: 3px auto 0;
}
.calendar-control {

  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.selected-date-top {
  font-family: 'Space Mono', monospace;
  font-size: 15px;
  font-weight: bold;
  color: var(--ink-soft);
}

  footer button {
    background: none;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  footer button:hover { color: var(--stamp-red); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="margin-rule"></div>
    <header>
      <div class="kicker" id="dateLine">—</div>
      <h1>Darvik's To-Do Work</h1>
      <div class="subhead">Plan it. Do it. Finish it.
      <br> ======YOU CAN DO IT======
      </div>
    </header>

<div class="calendar-control">
    <button class="calendar-toggle" id="calendarToggle">
          📅 Calendar
    </button>
    <span class="selected-date-top" id="selectedDateTop">—</span>
</div>
    <div class="calendar" id="calendar">
  <div class="calendar-header">
    <button id="prevMonth">‹</button>
    <h2 id="monthYear"></h2>
    <button id="nextMonth">›</button>
  </div>

  <div class="weekdays">
    <span>Sun</span>
    <span>Mon</span>
    <span>Tue</span>
    <span>Wed</span>
    <span>Thu</span>
    <span>Fri</span>
    <span>Sat</span>
  </div>
  <div class="selected-date" id="selectedDate">
       —
  </div> 

  <div class="calendar-days" id="calendarDays"></div>
</div>
    

    <div class="entry-row">
      <input type="text" id="taskInput" placeholder="What needs doing…" maxlength="140">
      <select id = priorityinput>
        <option value="low">LOW</option>
        <option value="medium">MEDIUM</option>
        <option value="high">HIGH</option>
      </select>
      <button id="addBtn">Log it</button>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="emptyMsg">Nothing logged yet. The page is waiting.</div>

    <footer>
      <span id="countLine">0 open · 0 cleared . progress: 0%</span>
      <button id="clearDone">Clear stamped</button>
    </footer>
  </div>
  <div>
 <footer> 
    <div class="creator-credit">
         Published by Harsh Verma <br>
        instagram: <a href="https://www.instagram.com/harshverma3618/" target="_blank">
            @harshverma3618
        </a>
    </div>
 </footer>
</div>

<script>
 const list = document.getElementById('list');
const input = document.getElementById('taskInput');
const addBtn = document.getElementById('addBtn');
const priorityinput = document.getElementById('priorityinput');
const emptyMsg = document.getElementById('emptyMsg');
const countLine = document.getElementById('countLine');
const clearDoneBtn = document.getElementById('clearDone');
const dateLine = document.getElementById('dateLine');

const calendarToggle = document.getElementById('calendarToggle');
const calendar = document.getElementById('calendar');
const monthYear = document.getElementById('monthYear');
const calendarDays = document.getElementById('calendarDays');
const selectedDateElement = document.getElementById('selectedDate');
const selectedDateTop = document.getElementById('selectedDateTop');


// ====================
// CALENDAR OPEN / CLOSE
// ====================

calendarToggle.addEventListener('click', () => {
  if (calendar.style.display === 'none') {
    calendar.style.display = 'block';
  } else {
    calendar.style.display = 'none';
  }
});


// ====================
// DATE SETUP
// ====================

const today = new Date();

let viewYear = today.getFullYear();
let viewMonth = today.getMonth();

const savedDate = localStorage.getItem('selectedDate');

let selectedDate = savedDate
  ? new Date(savedDate + 'T00:00:00')
  : today;


// ====================
// FORMAT DATE
// ====================

function formatDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}


// ====================
// TASKS FROM STORAGE
// ====================

let tasks = JSON.parse(localStorage.getItem('tasks')) || [];


// Give old tasks today's date if they don't have one
tasks.forEach(t => {
  if (!t.date) {
    t.date = formatDate(today);
  }
});

localStorage.setItem('tasks', JSON.stringify(tasks));


// ====================
// ID COUNTER
// ====================

let idCounter = tasks.length > 0
  ? Math.max(...tasks.map(t => t.id)) + 1
  : 0;


// ====================
// SELECTED DATE TEXT
// ====================

function updateSelectedDate() {
  selectedDateElement.textContent =
    selectedDate.toLocaleDateString(undefined, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });
     selectedDateTop.textContent =
    String(selectedDate.getDate()).padStart(2, '0') + '/' +
    String(selectedDate.getMonth() + 1).padStart(2, '0') + '/' +
    selectedDate.getFullYear();
}


// ====================
// SHOW CALENDAR
// ====================

function showCalendar() {

  calendarDays.innerHTML = '';

  const year = viewYear;
  const month = viewMonth;


  // Month name
  monthYear.textContent =
    new Date(year, month, 1).toLocaleDateString(undefined, {
      month: 'long',
      year: 'numeric'
    });


  // First day of month
  const firstDay =
    new Date(year, month, 1).getDay();


  // Number of days
  const daysInMonth =
    new Date(year, month + 1, 0).getDate();


  // Empty spaces before first date
  for (let i = 0; i < firstDay; i++) {

    const emptyDay = document.createElement('div');

    calendarDays.appendChild(emptyDay);
  }


  // Create dates
  for (let day = 1; day <= daysInMonth; day++) {

    const dayElement = document.createElement('div');

   dayElement.innerHTML = `<span class="day-number">${day}</span>`;

    dayElement.className = 'calendar-day';
    if (
  day === today.getDate() &&
  month === today.getMonth() &&
  year === today.getFullYear()
) {
  dayElement.classList.add('today');
}


    // Date string
    const dateString = formatDate(new Date(year, month, day));
    if (tasks.some(t => t.date === dateString)) {
  dayElement.classList.add('has-task');
  const dot = document.createElement('span');
  dot.className = 'task-dot';
  dayElement.appendChild(dot);
}


    // Highlight selected date
    if (
      day === selectedDate.getDate() &&
      month === selectedDate.getMonth() &&
      year === selectedDate.getFullYear()
    ) {

      dayElement.classList.add('selected');
    }


    // Click date
    dayElement.addEventListener('click', () => {

      selectedDate =
        new Date(year, month, day);

      // Save selected date
      localStorage.setItem(
        'selectedDate',
        formatDate(selectedDate)
      );

      // Update screen
      showCalendar();
      updateSelectedDate();
      render();

    });


    calendarDays.appendChild(dayElement);
  }
}


// ====================
// PREVIOUS MONTH
// ====================

document.getElementById('prevMonth').addEventListener('click', () => {

  viewMonth--;

  if (viewMonth < 0) {

    viewMonth = 11;
    viewYear--;

  }

  showCalendar();
});


// ====================
// NEXT MONTH
// ====================

document.getElementById('nextMonth').addEventListener('click', () => {

  viewMonth++;

  if (viewMonth > 11) {

    viewMonth = 0;
    viewYear++;

  }

  showCalendar();
});


// ====================
// ADD TASK
// ====================

function addTask(text) {

  const trimmed = text.trim();

  if (!trimmed) return;


  tasks.push({

    id: idCounter++,

    text: trimmed,

    done: false,

    priority: priorityinput.value,

    date: formatDate(selectedDate)

  });


  localStorage.setItem(
    'tasks',
    JSON.stringify(tasks)
  );


  input.value = '';

  render();

  showCalendar();
}


// ====================
// COMPLETE TASK
// ====================

function toggleTask(id) {

  const task = tasks.find(t => t.id === id);

  if (task) {

    task.done = !task.done;

  }


  localStorage.setItem(
    'tasks',
    JSON.stringify(tasks)
  );


  render();
}


// ====================
// DELETE TASK
// ====================

function removeTask(id) {

  tasks =
    tasks.filter(t => t.id !== id);


  localStorage.setItem(
    'tasks',
    JSON.stringify(tasks)
  );


  render();

  showCalendar();
}


// ====================
// CLEAR COMPLETED
// ====================

function clearDone() {

  tasks =
    tasks.filter(t => !t.done);


  localStorage.setItem(
    'tasks',
    JSON.stringify(tasks)
  );


  render();

  showCalendar();
}


// ====================
// RENDER TASKS
// ====================

function render() {

  list.innerHTML = '';


  // Only tasks for selected date
  const selectedTasks =
    tasks.filter(
      t => t.date === formatDate(selectedDate)
    );


  // No tasks
  if (selectedTasks.length === 0) {

    emptyMsg.style.display = 'block';

  } else {

    emptyMsg.style.display = 'none';


    selectedTasks.forEach(t => {

      const li =
        document.createElement('li');

      li.className =
        'item' + (t.done ? ' done' : '');


      // Checkbox
      const check =
        document.createElement('button');

      check.className =
        'check' + (t.done ? ' done' : '');

      check.setAttribute(
        'aria-label',
        t.done
          ? 'Mark as open'
          : 'Mark as done'
      );

      check.onclick =
        () => toggleTask(t.id);


      // Task text
      const span =
        document.createElement('span');

      span.className = 'item-text';

      span.textContent = t.text;


      // Priority
      const priority =
        document.createElement('span');

      priority.className =
        `priority ${t.priority}`;

      priority.textContent =
        t.priority;


      // Cleared stamp


      // Delete
      const remove =
        document.createElement('button');

      remove.className = 'remove';

      remove.setAttribute(
        'aria-label',
        'Delete task'
      );

      remove.textContent = '✕';

      remove.onclick =
        () => removeTask(t.id);


      // Put everything together
      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(priority);
      li.appendChild(remove);

      list.appendChild(li);

    });

  }


  // Counters
  const openCount =
    selectedTasks.filter(t => !t.done).length;

  const doneCount =
    selectedTasks.filter(t => t.done).length;


  const progress =
    selectedTasks.length === 0
      ? 0
      : Math.round(
          (doneCount / selectedTasks.length) * 100
        );


  countLine.textContent =
    `${openCount} open · ${doneCount} cleared · progress: ${progress}%`;
}


// ====================
// BUTTONS
// ====================

addBtn.addEventListener('click', () => {

  addTask(input.value);

});


input.addEventListener('keydown', (e) => {

  if (e.key === 'Enter') {

    addTask(input.value);

  }

});


clearDoneBtn.addEventListener(
  'click',
  clearDone
);


// ====================
// TOP DATE
// ====================

dateLine.textContent =
  today.toLocaleDateString(undefined, {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });


// ====================
// START APP
// ====================

showCalendar();

updateSelectedDate();

render();
</script>
</body>
</html>
